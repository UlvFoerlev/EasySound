name: Tests

# No paths filters: a required check that gets skipped never reports, which blocks the PR forever
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # --no-project keeps uv off .venv, the path __install__.py uses for the plugin's backend venv
      - name: Run tests
        run: uv run --no-project --python ${{ matrix.python-version }} --with pytest pytest

  # Single stable check name to require in branch protection, so the matrix can change freely
  tests-pass:
    if: always()
    needs: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Fail if any test job failed
        if: needs.pytest.result != 'success'
        run: exit 1
