name: Tests
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"
          python-version: "3.12"

      # No uv sync: there are no project deps, and it would claim .venv, which __install__.py owns
      - name: Pytest
        run: uv run --no-project --with pytest pytest
